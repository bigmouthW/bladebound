server {
    listen 3392 default_server;
    listen [::]:3392 default_server;
    server_name _;

    root /opt/bladebound/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/bladebound-access.log;
    error_log /var/log/nginx/bladebound-error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ ^/assets/index-[A-Za-z0-9_-]+\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }
}
